networks:
  ai-network:
    driver: bridge

volumes:
  mongodb_data:
  qdrant_data:
  n8n_global_data:

services:
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LLM_URL=${LLM_URL:-http://model-runner.docker.internal/v1/}
      - LLM_MODEL=${LLM_MODEL:-ai/smollm2}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60.0}
      - API_KEY=${API_KEY:-not-needed}
    volumes:
      - .:/app
    networks:
      - ai-network
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-network
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_global_data:/home/node/.n8n
    networks:
      - ai-network
    extra_hosts:
      - "model-runner.docker.internal:host-gateway"
    restart: unless-stopped